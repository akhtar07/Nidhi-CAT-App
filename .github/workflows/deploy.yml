name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      # schema-validate-content (SPEC.md §7): schemas.py is the single
      # source of truth (PROGRESS.md) — fail if the committed JSON Schemas
      # or TS types have drifted from it, and validate all content data
      # against the schemas + cross-reference checks (orphan microTopicId,
      # duplicate ids, prerequisite cycles).
      - name: Check JSON Schemas match schemas.py
        working-directory: pipeline
        run: python generate_json_schemas.py --check

      - name: Check TS types match JSON Schemas
        working-directory: app
        run: npm run generate:types:check

      - name: Validate content
        working-directory: pipeline
        run: python validate_content.py

      - name: Unit tests
        working-directory: app
        run: npm run test

      - name: Build
        working-directory: app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
